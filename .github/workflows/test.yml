name: test

on:
  push:
    branches: [master]
    tags: ['*-v*']
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # postgres' tests run against this server; without POSTGRES_TEST_URL
    # they skip.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-package selection diffs against the base branch or
          # the previous push; a shallow clone has neither.
          fetch-depth: 0

      # lg, lgx and go, at the versions in .mise.toml.
      - uses: jdx/mise-action@v3

      # Every package runs on a custom lg that lgx builds with the Go
      # toolchain (:lg-runtime :built). The build is cached by its inputs,
      # so a run with unchanged lgx.edn files reuses the runtime.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.lgx/runtimes
          key: runtimes-${{ runner.os }}-${{ hashFiles('**/lgx.edn') }}
          restore-keys: runtimes-${{ runner.os }}-

      - name: Test the changed packages
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CHANGED_PATHS_FILE: ${{ runner.temp }}/changed-paths.txt
        run: |
          set -euo pipefail
          packages="$(bash .github/scripts/changed-packages.sh)"
          echo "packages to test: ${packages:-<none>}"
          # A package with a tagged Go shim (duckdb) pins the *released*
          # shim in its lgx.edn (see "Releasing" in the README), so a change
          # to <pkg>/shim/ would otherwise be tested against the published Go
          # module, not the checked-out code. Flip each changed shim's coord
          # to the working tree for this run only - the same move a shim
          # author makes locally. A tag run writes no changed-paths file, and
          # most runs change no shim: both are no-ops. The pattern stops after
          # the version string, so any key that follows it on the coord
          # survives the flip. A package with an in-tree shim (livekit, wails, nrepl, sql, postgres) is exempt
          # by design: its coord is already {:go/local "shim"}, so it tests the
          # working tree as is, and having no :go/version it never matches.
          shim_pkgs=""
          if [ -f "$CHANGED_PATHS_FILE" ]; then
            shim_pkgs="$(grep -o '^[^/]*/shim/' "$CHANGED_PATHS_FILE" | cut -d/ -f1 | sort -u || true)"
          fi
          for pkg in $shim_pkgs; do
            [ -f "$pkg/lgx.edn" ] || continue
            echo "$pkg/shim/ changed: testing against the checked-out shim"
            sed -i "s#$pkg/shim {:go/version \"[^\"]*\"#$pkg/shim {:go/local \"shim\"#" "$pkg/lgx.edn"
            grep -n "$pkg/shim" "$pkg/lgx.edn"
          done
          failed=0
          for pkg in $packages; do
            if [ -d "$pkg/test" ]; then
              echo "==> $pkg: lgx test"
              if [ "$pkg" = wails ]; then
                # The runner has no GTK4/WebKitGTK, so wails tests run in
                # Wails' cgo-free server mode: an HTTP server instead of a
                # window. Both vars are needed - a few Wails packages gate
                # on `linux && cgo` without a `!server` guard.
                (cd "$pkg" && CGO_ENABLED=0 GOFLAGS=-tags=server lgx test) || failed=1
              else
                (cd "$pkg" && lgx test) || failed=1
              fi
            else
              echo "==> $pkg: no test/ directory, skipped"
            fi
          done
          exit $failed
